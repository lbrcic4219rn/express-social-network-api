<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Posts</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%92%AC</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
<nav id="nav" class="navbar navbar-expand navbar-dark bg-dark mb-4"></nav>
<main class="container pb-5">
    <h1 class="h3 mb-1">Posts</h1>
    <p class="text-secondary">Create, edit and remove posts, and browse everything that exists.</p>
    <div id="status" aria-live="polite"></div>
    <div class="row g-4">
        <div class="col-lg-5">
    <div class="card mb-3">
        <div class="card-header">Create post</div>
        <div class="card-body">
            <form id="createPostForm">
            <div class="mb-3">
                <label for="descriptionInput" class="form-label">Description</label>
                <input type="text" id="descriptionInput" name="data" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="imageLinkInput" class="form-label">Image link</label>
                <input type="url" id="imageLinkInput" name="image" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="tagsInput" class="form-label">Tags</label>
                <input type="text" id="tagsInput" name="tags" class="form-control" required placeholder="space separated">
            </div>
                <button type="submit" class="btn btn-primary">Submit post</button>
            </form>
        </div>
    </div>
    <div class="card mb-3">
        <div class="card-header">Edit post</div>
        <div class="card-body">
            <form id="editPostForm">
            <div class="mb-3">
                <label for="idInputEdit" class="form-label">Post ID</label>
                <input type="number" id="idInputEdit" name="postId" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="descriptionInputEdit" class="form-label">Description</label>
                <input type="text" id="descriptionInputEdit" name="data" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="imageLinkInputEdit" class="form-label">Image link</label>
                <input type="url" id="imageLinkInputEdit" name="image" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="tagsInputEdit" class="form-label">Tags</label>
                <input type="text" id="tagsInputEdit" name="tags" class="form-control" required placeholder="space separated">
            </div>
                <button type="submit" class="btn btn-primary">Save changes</button>
            </form>
        </div>
    </div>
    <div class="card mb-3">
        <div class="card-header">Delete post</div>
        <div class="card-body">
            <form id="deletePostForm">
            <div class="mb-3">
                <label for="deletePostInput" class="form-label">Post ID</label>
                <input type="number" id="deletePostInput" name="postId" class="form-control" required>
            </div>
                <button type="submit" class="btn btn-danger">Delete post</button>
            </form>
        </div>
    </div>
        </div>
        <div class="col-lg-7">
            <div class="card">
                <div class="card-header">All posts</div>
                <div class="card-body">
                    <div id="content"></div>
                </div>
            </div>
        </div>
    </div>
</main>
<script src="./scripts/common.js"></script>
<script src="./scripts/post.js"></script>
</body>
</html>
