<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Social network</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%92%AC</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
<nav id="nav" class="navbar navbar-expand navbar-dark bg-dark mb-4"></nav>
<main class="container pb-5">
    <h1 class="h3 mb-1">Social network</h1>
    <p class="text-secondary">A demo client for the Express and Sequelize REST API.</p>
    <div id="status" aria-live="polite"></div>
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-3 mt-1">
        <div class="col">
            <a class="card h-100 text-decoration-none" href="post.html">
                <div class="card-body">
                    <h2 class="h5 card-title">Posts</h2>
                    <p class="card-text text-secondary">Create posts with tags, edit them, like and unlike.</p>
                </div>
            </a>
        </div>
        <div class="col">
            <a class="card h-100 text-decoration-none" href="story.html">
                <div class="card-body">
                    <h2 class="h5 card-title">Stories</h2>
                    <p class="card-text text-secondary">Short lived entries owned by a user.</p>
                </div>
            </a>
        </div>
        <div class="col">
            <a class="card h-100 text-decoration-none" href="comment.html">
                <div class="card-body">
                    <h2 class="h5 card-title">Comments</h2>
                    <p class="card-text text-secondary">Comment on a post, edit or remove your own.</p>
                </div>
            </a>
        </div>
        <div class="col">
            <a class="card h-100 text-decoration-none" href="user.html">
                <div class="card-body">
                    <h2 class="h5 card-title">Users</h2>
                    <p class="card-text text-secondary">Profiles, bios and account management.</p>
                </div>
            </a>
        </div>
    </div>
</main>
<script src="./scripts/common.js"></script>
</body>
</html>
