<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Users</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%92%AC</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
<nav id="nav" class="navbar navbar-expand navbar-dark bg-dark mb-4"></nav>
<main class="container pb-5">
    <h1 class="h3 mb-1">Users</h1>
    <p class="text-secondary">Edit your own profile, or manage any account as an admin.</p>
    <div id="status" aria-live="polite"></div>
    <div class="row g-4">
        <div class="col-lg-5">
    <div class="card mb-3">
        <div class="card-header">Edit my profile</div>
        <div class="card-body">
            <form id="editUserForm">
            <div class="mb-3">
                <label for="bioInputEdit" class="form-label">Bio</label>
                <input type="text" id="bioInputEdit" name="bio" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="profilePictureInputEdit" class="form-label">Profile picture</label>
                <input type="url" id="profilePictureInputEdit" name="profilePicture" class="form-control" required>
            </div>
                <button type="submit" class="btn btn-primary">Save profile</button>
            </form>
        </div>
    </div>
    <div class="card mb-3">
        <div class="card-header">Delete user</div>
        <div class="card-body">
            <form id="deleteUserForm">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-control" required>
            </div>
                <button type="submit" class="btn btn-danger">Delete user</button>
            </form>
        </div>
    </div>
        </div>
        <div class="col-lg-7">
            <div class="card">
                <div class="card-header">All users</div>
                <div class="card-body">
                    <div id="content"></div>
                </div>
            </div>
        </div>
    </div>
</main>
<script src="./scripts/common.js"></script>
<script src="./scripts/user.js"></script>
</body>
</html>
