<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%92%AC</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body class="bg-body-tertiary">
<main class="container" style="max-width: 24rem">
    <header class="text-center my-5">
        <h1 class="h3">Create an account</h1>
    </header>
    <div class="card">
        <div class="card-body">
            <form id="registerForm">
            <div class="mb-3">
                <label for="usernameInput" class="form-label">Username</label>
                <input type="text" id="usernameInput" name="username" class="form-control" required autocomplete="username" minlength="3" maxlength="30">
            </div>
            <div class="mb-3">
                <label for="passwordInput" class="form-label">Password</label>
                <input type="password" id="passwordInput" name="password" class="form-control" required autocomplete="new-password" minlength="8">
            </div>
            <div class="mb-3">
                <label for="passwordInput2" class="form-label">Confirm password</label>
                <input type="password" id="passwordInput2" name="password2" class="form-control" required autocomplete="new-password" minlength="8">
            </div>
                <button type="submit" class="btn btn-primary w-100">Register</button>
            </form>
            <div id="status" aria-live="polite" class="mt-3"></div>
        </div>
    </div>
    <p class="text-center text-secondary mt-3">Already registered? <a href="login.html">Log in</a></p>
</main>
<script src="./scripts/common.js"></script>
<script src="./register.js"></script>
</body>
</html>
