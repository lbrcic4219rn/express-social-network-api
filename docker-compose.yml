services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_NAME:-social_network}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Runs migrations and seeds once, then exits. Both services wait for it.
  migrate:
    build: .
    command: sh -c "npm run migrate && npm run seed"
    environment: &db_env
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      DB_NAME: ${DB_NAME:-social_network}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?set ACCESS_TOKEN_SECRET in .env}
      CLIENT_ORIGINS: ${CLIENT_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme123}
    depends_on:
      db:
        condition: service_healthy

  auth:
    build: .
    command: npm run start:auth
    environment: *db_env
    ports:
      - "9000:9000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: .
    command: npm start
    environment: *db_env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db_data:
